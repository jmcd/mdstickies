<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mdstickies: Markdown sticky notes</title>
    <meta name="description" content="Write sticky notes in Markdown and arrange them on a board. Runs in your browser; notes stay on your device." />
    <link rel="canonical" href="https://mdstickies.com/" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#24272c" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="mdstickies" />
    <meta property="og:title" content="mdstickies: Markdown sticky notes" />
    <meta property="og:description" content="Write sticky notes in Markdown and arrange them on a board. Runs in your browser; notes stay on your device." />
    <meta property="og:url" content="https://mdstickies.com/" />
    <meta property="og:image" content="https://mdstickies.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Three Markdown sticky notes on the mdstickies board" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Mirrors ThemeControl (src/ui/theme.ts) so a dark board doesn't flash white while the app loads.
      try {
        const pref = localStorage.getItem('mdstickies:v1:theme');
        const dark = pref === 'dark' || (pref !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
